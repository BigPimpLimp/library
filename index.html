<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="headerWrapper">
        <h1 class="header">My Library</h1>
        <img class="header" src="svg/bookshelf-2-svgrepo-com.svg" alt="Book Shelf SVG">
    </div>
    <div id="main">
        <button id="openDialog">Add Book</button>
        <div class="form">
            <dialog id="bookDialog">
            <form id="bookForm">
                <div>
                    <label for="book_name">Book:</label>
                    <input type="text" id="book_name" name="book_name">
                </div>
                <div>
                    <label for="author_name">Author:</label>
                    <input type="text" id="author_name" name="author_name">
                </div>
                <div>
                    <label for="num_pages">Number of Pages:</label>
                    <input type="number" id="num_pages" name="num_pages">
                </div>
                <div>
                    <label for="read">Read?</label>
                    <input type="checkbox" id="read" name="read" value="off">
                </div>
                <div class="buttonDiv">
                    <button type="submit" id="addBook">Submit</button>
                    <button id="closeDialog">Close</button>
                </div>
            </form>
        </dialog>
        </div>
        <div id="card-wrapper"></div>
        <div class="footer">

        </div>


    </div>
</body>
</html>
    </div>
</body>
</html>
